# sapp.yml — single manifest for the sapp* suite. schema: sapp/1
# Sections mirror the legacy per-tool dotfiles (see sapptools/_project/upgrade/SPEC-manifest.md).
# A tool reads its section here FIRST; legacy dotfiles are fallback only.
schema: sapp/1
monitor:
  schema: 1
  id: sappkit
  name: sappkit
  description: >
    SappKit — punchy, fun drums & percussion instrument (JUCE
    Standalone/VST3/AU) built on the SappSounds engine. 16-pad kit model over
    SFZ drum libraries, per-pad tune/decay/pan/level, kit-wide
    punch/squash/crush/room, dark club UI, agent CLI with deterministic renders,
    SappLink CC-in.
  status: paused
  tags:
    - web
    - internal
  owner: localteampartners@gmail.com
  urls:
    primary: https://example.com
    admin: https://example.com/admin
    docs: https://example.com/docs
    repo: https://github.com/you/repo
  host:
    vps: none
    path: /var/www/example
    process_manager: pm2
    pm2_name: example-api
    nginx_site: example.com
  stack:
    runtime: node 22
    framework: next.js 15
    database: postgres 16
    key_libraries: []
    external_services:
      - stripe
      - openai
  purpose: |
    What problem this project solves and for whom.
  features:
    - User-facing feature A
    - Admin feature B
    - Scheduled job C
  checks:
    - name: homepage
      type: http
      url: https://example.com
      method: GET
      expect_status: 200
      expect_body_contains: ""
      timeout_ms: 5000
      interval_seconds: 60
      headers: {}
  notes: |
    Anything worth remembering: gotchas, deploy quirks, who to call, known
    flaky behavior, etc. Free-form markdown.
backup:
  schema: 1
  project_id: sappkit
  artifacts:
    - name: code
      type: git_tarball
      source: .
      tier: hot
    - name: docs
      type: project_docs
      source: _project
      tier: hot
  schedule: daily
security:
  thresholds:
    critical: 0
    high: 0
    medium: -1
    low: -1
    info: -1
  ignore: []
  disabledRules: []
  severityOverrides: {}
  scanners: []
  deepReview:
    enabled: false
    model: claude-sonnet-4-6
    maxFiles: 20
project:
  name: sappkit
