name: release-builds

# WINDOWS ONLY (mac jobs removed 2026-08-08). Builds VST3/Standalone for
# Windows, and attaches the zips to the GitHub release for the given tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:

  windows:
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAPPKIT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: powershell
        run: |
          $art = "build/SappKitPlugin_artefacts/Release"
          $stage = "SappKit-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse "$art/VST3/SappKit.vst3" "$stage/"
          Copy-Item "$art/Standalone/SappKit.exe" "$stage/"
          Copy-Item "build/Release/sappkit.exe" "$stage/" -ErrorAction SilentlyContinue
          Set-Content -Path "$stage/INSTALL.txt" -Value @(
            'SappKit — Windows x64',
            '',
            '1. Copy the SappKit.vst3 folder to: C:\Program Files\Common Files\VST3\',
            '2. SappKit.exe is the standalone version — run it from anywhere.',
            'Then rescan plugins in your DAW.'
          )
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: powershell
        run: |
          # gh writes "release not found" to stderr, and Windows PowerShell turns
          # native stderr into a terminating error under ErrorActionPreference=Stop
          # (pwsh 7 on hosted runners does not) - so soften it around the probe.
          $ErrorActionPreference = "Continue"
          gh release view "$env:TAG" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          $ErrorActionPreference = "Stop"
          gh release upload "$env:TAG" "SappKit-$env:TAG-Windows-x64.zip" --clobber

  # THE GUARD. sapptune v0.28.0 once shipped with no plugin: the build passed,
  # a later step failed, the upload was skipped, and the release looked green.
  # A tag must never exist without its binary.
  verify-release-assets:
    needs: windows
    if: always() && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: The release must carry its build
        run: |
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo "")
          echo "assets on $TAG: ${assets:-<none>}"
          case "$assets" in
            *Windows-x64*) echo "OK - the build is attached." ;;
            *) echo "::error::$TAG has no Windows-x64 asset - the build or upload did not complete."
               exit 1 ;;
          esac
