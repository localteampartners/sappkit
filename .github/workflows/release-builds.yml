name: release-builds

# Builds VST3/AU/Standalone for macOS (universal) and VST3/Standalone for
# Windows, and attaches the zips to the GitHub release for the given tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSAPPKIT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Package
        run: |
          ART="build/SappKitPlugin_artefacts/Release"
          STAGE="SappKit-$TAG-macOS-universal"
          mkdir -p "$STAGE"
          cp -R "$ART/VST3/SappKit.vst3" "$STAGE/"
          cp -R "$ART/AU/SappKit.component" "$STAGE/"
          cp -R "$ART/Standalone/SappKit.app" "$STAGE/"
          cp "build/sappkit" "$STAGE/" || true
          {
            echo 'SappKit — macOS (universal: Apple Silicon + Intel)'
            echo ''
            echo '1. Copy SappKit.vst3      -> ~/Library/Audio/Plug-Ins/VST3/'
            echo '2. Copy SappKit.component -> ~/Library/Audio/Plug-Ins/Components/'
            echo '3. SappKit.app is the standalone version.'
            echo ''
            echo 'Unsigned build: after copying, clear quarantine once:'
            echo '  xattr -rc ~/Library/Audio/Plug-Ins/VST3/SappKit.vst3 ~/Library/Audio/Plug-Ins/Components/SappKit.component'
            echo 'Then rescan plugins in your DAW.'
          } > "$STAGE/INSTALL.txt"
          zip -qry "$STAGE.zip" "$STAGE"
      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "SappKit-$TAG-macOS-universal.zip" --clobber

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAPPKIT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $art = "build/SappKitPlugin_artefacts/Release"
          $stage = "SappKit-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse "$art/VST3/SappKit.vst3" "$stage/"
          Copy-Item "$art/Standalone/SappKit.exe" "$stage/"
          Copy-Item "build/Release/sappkit.exe" "$stage/" -ErrorAction SilentlyContinue
          Set-Content -Path "$stage/INSTALL.txt" -Value @(
            'SappKit — Windows x64',
            '',
            '1. Copy the SappKit.vst3 folder to: C:\Program Files\Common Files\VST3\',
            '2. SappKit.exe is the standalone version — run it from anywhere.',
            'Then rescan plugins in your DAW.'
          )
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: pwsh
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          gh release upload "$env:TAG" "SappKit-$env:TAG-Windows-x64.zip" --clobber
